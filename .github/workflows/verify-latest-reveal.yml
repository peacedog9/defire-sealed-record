name: Verify latest revealed batch

# 2026-08-10: the push trigger is gone on purpose. The issuance stamper
# pushes a witness commit EVERY MINUTE, and each one touched daily-index.json,
# so this workflow ran (and, while the public mirror was unreachable, failed
# and emailed) 1440 times a day. Verification integrity does not need a run
# per witness: the event that matters is the nightly reveal (00:15 UTC), and
# the 02:23 UTC schedule below verifies it daily, plus workflow_dispatch for
# on-demand runs. Do not re-add a push trigger while the stamper commits at
# minute cadence.
on:
  schedule:
    - cron: "23 02 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealed-record-independent-verification
  cancel-in-progress: false

jobs:
  verify-public-record:
    name: Fresh Ubuntu verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run commit-pinned public verifier
        env:
          DEFIRE_SEALED_MIRROR_INDEX_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/daily-index.json
          DEFIRE_SEALED_MIRROR_ISSUANCE_INDEX_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/issuance-index.json
        run: |
          for asset in verify-latest-reveal.sh verify-public-issuance.py digicert_assured_id_root_ca.crt; do
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${asset}" -o "${asset}"
          done
          chmod 0755 verify-latest-reveal.sh
          ./verify-latest-reveal.sh
